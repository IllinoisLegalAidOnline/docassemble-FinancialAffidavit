objects:
  - additional_cash: ALDocument.using(title="FA Additional Cash", filename="FA_additional_cash.pdf", has_addendum=False)
---
code: |
  additional_cash.enabled = (has_cash_assets and cash.number_gathered() >= 4) or (has_cert_deposit and cert_deposit.number_gathered() >= 4) or (has_money and money.number_gathered() >= 4)
