############ FA ADDITIONAL DEBTS #############
objects:
  - additional_debts: ALDocument.using(title="FA Additional Debts", filename="FA_additional_debts.pdf", has_addendum=False)
---
code: |
  additional_debts.enabled = has_debts and debts.number_gathered() >= 7
---
attachment:
  name: additional_debts
  variable name: additional_debts[i]
  filename: additional_debts
  skip undefined: True
  editable: False
  pdf template file: FA_additional_debts.pdf
  fields:
    - "county_name": ${ case_county }
    - "case_number": ${ case_number }
    - "petitioner_name": |
        % if party_label == 'petitioner' or party_label == 'plaintiff':
        ${ users[0].name_full() }
        % else:
        ${ other_parties[0].name_full() }
        % endif
    - "respondent_name": |
        % if party_label == 'petitioner' or party_label == 'plaintiff':
        ${ other_parties[0].name_full() }
        % else:
        ${ users[0].name_full() }
        % endif
    - "creditor_name_7": |
        % if debts.number_gathered() >= 7:
        ${ debts[6].name.text }
        % endif
    - "creditor_description_7": |
        % if debts.number_gathered() >= 7:
        ${ debts[6].description }
