---
############ FA ADDITIONAL CHILD SUPPORT #############
objects:
  - additional_child_support: ALDocument.using(title="FA Additional Child Support", filename="FA_additional_child_support.pdf", has_addendum=False)
---
code: |
  additional_child_support.enabled = (users[0].child_support_other_cases and other_cs_cases.number_gathered() > 3) or (users[0].child_support_no_court_order and other_cs_parents.number_gathered() > 3) or (users[0].child_support_in_home and other_cs_kids_in_home.number_gathered() > 3)
---
attachment:
  name: additional_child_support
  variable name: additional_child_support[i]
  filename: additional_child_support
  skip undefined: True
  editable: False
  pdf template file: FA_additional_child_support.pdf
  fields:
    - "county_name": ${ case_county }
    - "case_number": ${ case_number }
    - "petitioner_name": |
        % if party_label == 'petitioner' or party_label == 'plaintiff':
        ${ users[0].name_full() }
        % else:
        ${ other_parties[0].name_full() }
        % endif
    - "respondent_name": |
        % if party_label == 'petitioner' or party_label == 'plaintiff':
        ${ other_parties[0].name_full() }
        % else:
        ${ users[0].name_full() }
        % endif

    - "cs_other_case_loc_5": |
        % if users[0].child_support_other_cases and other_cs_cases.number_gathered() > 4:
        ${ other_cs_cases[4].county + ", " + state_name(other_cs_cases[4].state)}
        % endif          
    - "cs_other_case_kids_5": |
        % if users[0].child_support_other_cases and other_cs_cases.number_gathered() > 4:
        ${ int(other_cs_cases[4].num_kids) }
        % endif
    - "cs_other_case_num_5": |
        % if users[0].child_support_other_cases and other_cs_cases.number_gathered() > 4:
        ${ other_cs_cases[4].name.text }
        % endif
    - "cs_other_case_amount_5": |
